server:
  port: 2333
  address: 127.0.0.1  # Hanya localhost untuk keamanan

lavalink:
  server:
    password: "ChillAsylumBebot2026"
    sources:
      youtube: false  # Dihandle oleh youtube-plugin
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 2000  # Lebih besar untuk mengurangi stuttering
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: false  # Pakai plugin
    soundcloudSearchEnabled: true
    gc-warnings: false  # Kurangi noise di log

  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    clientOptions:
      WEB:
        playback: false
        videoLoading: true
        playlistLoading: true
        searching: true
      ANDROID_VR:
        playback: true
        videoLoading: false
        searching: false
      MUSIC:
        playback: true
        videoLoading: true
        searching: true
      WEBEMBEDDED:
        playback: true
        videoLoading: true
        searching: false

logging:
  file:
    path: ./logs/
    max-history: 7
    max-size: 25MB

  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
